# Deploys the hosted game on every push to main:
#   1. backend: Postgres tables + the `api` Edge Function on Supabase
#      (skipped until the Supabase secrets below are set)
#   2. site:    public/ to GitHub Pages, pointed at that backend
#
# Setup (see README "Hosting"):
#   repo variable  SUPABASE_PROJECT_REF   e.g. abcdefghijklmnopqrst (a secret also works)
#   repo secrets   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   optional       GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (turns on "Sign in with Google")
#   Settings > Pages > Source: GitHub Actions
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check Supabase setup
        id: setup
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase is not configured, so only the offline game is deployed. See README > Hosting."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF should be the 20-character project id from your Supabase URL."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.setup.outputs.ready == 'true'
        run: npm test
      - if: steps.setup.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.setup.outputs.ready == 'true'
        name: Create or update tables
        run: |
          supabase link --project-ref "$PROJECT_REF"
          echo y | supabase db push
      - if: steps.setup.outputs.ready == 'true'
        name: Deploy the api function
        run: |
          node scripts/build-edge.mjs
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
      - if: steps.setup.outputs.ready == 'true'
        name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/api/leaderboard"; then exit 0; fi
            sleep 10
          done
          exit 1

  site:
    needs: backend
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          touch _site/.nojekyll
          if [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "export const API_BASE = 'https://$PROJECT_REF.supabase.co/functions/v1/api';" > _site/js/config.js
            if [ "$HAS_GOOGLE" = "true" ]; then
              echo "export const GOOGLE_AUTH_URL = 'https://$PROJECT_REF.supabase.co/auth/v1';" >> _site/js/config.js
            else
              echo "export const GOOGLE_AUTH_URL = null;" >> _site/js/config.js
            fi
          else
            echo "export const API_BASE = null; // no backend configured" > _site/js/config.js
            echo "export const GOOGLE_AUTH_URL = null;" >> _site/js/config.js
          fi
          cat _site/js/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Points Supabase Auth at the published site and turns on the Google
      # provider, so "Sign in with Google" returns to the game.
      - name: Configure Google sign-in
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if ! [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "Google sign-in not configured, skipping."
            exit 0
          fi
          [[ "$PAGE_URL" == */ ]] || PAGE_URL="$PAGE_URL/"
          body=$(jq -n --arg site "$PAGE_URL" --arg id "$GOOGLE_CLIENT_ID" --arg secret "$GOOGLE_CLIENT_SECRET" '{
            site_url: $site,
            uri_allow_list: ($site + "**"),
            external_google_enabled: true,
            external_google_client_id: $id,
            external_google_secret: $secret
          }')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$code" -ge 300 ]; then
            echo "::error::Supabase auth config failed ($code)"; head -c 500 resp.json; exit 1
          fi
          echo "Google sign-in enabled; redirects allowed to $PAGE_URL"
