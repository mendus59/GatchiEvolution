# Supabase pauses free projects after a week without activity. A light
# database read every few days keeps the backend awake.
name: Keep backend awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_PROJECT_REF != ''
    steps:
      - env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/api/leaderboard" > /dev/null
